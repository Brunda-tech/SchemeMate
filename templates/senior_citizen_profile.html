<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Citizen Profile - SchemeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="profile-page category-profile-page">
    <main class="auth-container">
        <section class="auth-box profile-box">
            <h1>👴 Senior Citizen Profile</h1>
            <p>Tell us about your needs to explore relevant senior citizen schemes.</p>

            {% if message %}<p class="profile-message" role="status">{{ message }}</p>{% endif %}

            <form class="profile-form" method="POST">
                <div class="profile-field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="60" max="120" required>
                </div>
                <div class="profile-field">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" autocomplete="address-level1" required>
                </div>
                <div class="profile-field">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" autocomplete="address-level2" required>
                </div>
                <div class="profile-field">
                    <label for="annual_income">Annual Family Income (₹)</label>
                    <input type="number" id="annual_income" name="annual_income" min="0" step="1" required>
                </div>
                <div class="profile-field">
                    <label for="pension_status">Do you receive a pension?</label>
                    <select id="pension_status" name="pension_status" required>
                        <option value="">Select an option</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="Applied">Application in progress</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="living_arrangement">Living Arrangement</label>
                    <select id="living_arrangement" name="living_arrangement" required>
                        <option value="">Select living arrangement</option>
                        <option value="Alone">Alone</option>
                        <option value="With spouse">With spouse</option>
                        <option value="With family">With family</option>
                        <option value="Assisted living">Assisted living</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="category">Social Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="EWS">EWS</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit">Continue</button>
            </form>
        </section>
    </main>
{% include "chatbot_widget.html" %}
</body>
</html>
