<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women’s Profile - SchemeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="profile-page category-profile-page">
    <main class="auth-container">
        <section class="auth-box profile-box">
            <h1>👩 Women’s Profile</h1>
            <p>Share a few details to explore schemes that support women.</p>

            {% if message %}<p class="profile-message" role="status">{{ message }}</p>{% endif %}

            <form class="profile-form" method="POST">
                <div class="profile-field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" required>
                </div>
                <div class="profile-field">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" autocomplete="address-level1" required>
                </div>
                <div class="profile-field">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" autocomplete="address-level2" required>
                </div>
                <div class="profile-field">
                    <label for="education_level">Education Level</label>
                    <select id="education_level" name="education_level" required>
                        <option value="">Select education level</option>
                        <option value="No formal education">No formal education</option>
                        <option value="Primary">Primary</option>
                        <option value="Secondary">Secondary</option>
                        <option value="PUC">PUC / 12th</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Undergraduate">Undergraduate</option>
                        <option value="Postgraduate">Postgraduate</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="occupation">Occupation</label>
                    <select id="occupation" name="occupation" required>
                        <option value="">Select occupation</option>
                        <option value="Student">Student</option>
                        <option value="Employed">Employed</option>
                        <option value="Self-employed">Self-employed</option>
                        <option value="Homemaker">Homemaker</option>
                        <option value="Unemployed">Unemployed</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="annual_income">Annual Family Income (₹)</label>
                    <input type="number" id="annual_income" name="annual_income" min="0" step="1" required>
                </div>
                <div class="profile-field">
                    <label for="marital_status">Marital Status</label>
                    <select id="marital_status" name="marital_status" required>
                        <option value="">Select marital status</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Widowed">Widowed</option>
                        <option value="Separated">Separated</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="category">Social Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="EWS">EWS</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit">Continue</button>
            </form>
        </section>
    </main>
{% include "chatbot_widget.html" %}
</body>
</html>
