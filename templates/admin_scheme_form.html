<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form_title }} - SchemeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-page">
    <main class="admin-container admin-form-container">
        <span class="results-eyebrow">SCHEMEMATE ADMIN</span>
        <h1>{{ form_title }}</h1>

        {% if error %}
            <p class="admin-error" role="alert">{{ error }}</p>
        {% endif %}

        <form class="admin-form" method="post" action="{{ form_action }}">
            <input type="hidden" name="csrf_token" value="{{ admin_csrf_token() }}">

            <label for="scheme_name">Scheme name *</label>
            <input id="scheme_name" name="scheme_name" maxlength="255" required
                   value="{{ scheme.get('scheme_name', '') }}">

            <label for="description">Description *</label>
            <textarea id="description" name="description" maxlength="10000" required>{{ scheme.get('description', '') }}</textarea>

            <label for="target_role">Target role *</label>
            <select id="target_role" name="target_role" required>
                <option value="">Select a role</option>
                {% for role in target_roles %}
                    <option value="{{ role }}" {% if scheme.get('target_role') == role %}selected{% endif %}>{{ role }}</option>
                {% endfor %}
            </select>

            <label for="state">State or coverage *</label>
            <input id="state" name="state" maxlength="100" required
                   placeholder="For example: All India"
                   value="{{ scheme.get('state', '') }}">

            <div class="admin-form-row">
                <div>
                    <label for="min_age">Minimum age</label>
                    <input id="min_age" name="min_age" type="number" min="0" max="130"
                           value="{{ scheme.get('min_age', '') if scheme.get('min_age') is not none else '' }}">
                </div>
                <div>
                    <label for="max_age">Maximum age</label>
                    <input id="max_age" name="max_age" type="number" min="0" max="130"
                           value="{{ scheme.get('max_age', '') if scheme.get('max_age') is not none else '' }}">
                </div>
                <div>
                    <label for="max_income">Maximum income</label>
                    <input id="max_income" name="max_income" type="number" min="0" step="0.01"
                           value="{{ scheme.get('max_income', '') if scheme.get('max_income') is not none else '' }}">
                </div>
            </div>

            <label for="category">Category</label>
            <input id="category" name="category" maxlength="100"
                   value="{{ scheme.get('category', 'All') }}">

            <label for="education_level">Education level</label>
            <input id="education_level" name="education_level" maxlength="100"
                   value="{{ scheme.get('education_level', 'All') }}">

            <label for="benefit">Benefit *</label>
            <textarea id="benefit" name="benefit" maxlength="10000" required>{{ scheme.get('benefit', '') }}</textarea>

            <label for="documents">Documents required *</label>
            <textarea id="documents" name="documents" maxlength="10000" required>{{ scheme.get('documents', '') }}</textarea>

            <label for="application_process">Application process *</label>
            <textarea id="application_process" name="application_process" maxlength="10000" required>{{ scheme.get('application_process', '') }}</textarea>

            <label for="official_link">Official HTTPS URL *</label>
            <input id="official_link" name="official_link" type="url" required
                   placeholder="https://example.gov.in"
                   value="{{ scheme.get('official_link', '') }}">

            <div class="admin-form-actions">
                <button class="admin-primary-button" type="submit">{{ submit_label }}</button>
                <a class="admin-back-link" href="{{ url_for('admin_schemes') }}">Cancel</a>
            </div>
        </form>
    </main>
    {% include "account_menu.html" %}
</body>
</html>
