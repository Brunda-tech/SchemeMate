<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - SchemeMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="profile-page">

<div class="auth-container">

    <div class="auth-box">

        <h1>Student Profile</h1>

        <p>Tell us a little about yourself to find relevant schemes.</p>

        <form method="POST">

            <!-- Age -->
            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="1"
                max="100"
                required
            >

            <!-- State -->
            <label for="state">State</label>
            <select id="state" name="state" required>

                <option value="">Select your state</option>

                <option value="Karnataka">Karnataka</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Kerala">Kerala</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Telangana">Telangana</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Other">Other</option>

            </select>


            <!-- Education -->
            <label for="education_level">
                Education Level
            </label>

            <select id="education_level"
                    name="education_level"
                    required>

                <option value="">Select education level</option>

                <option value="PUC">PUC / 12th</option>
                <option value="Diploma">Diploma</option>
                <option value="Undergraduate">
                    Undergraduate
                </option>
                <option value="Postgraduate">
                    Postgraduate
                </option>

            </select>


            <!-- Year -->
            <label for="year_of_study">
                Year of Study
            </label>

            <select id="year_of_study"
                    name="year_of_study"
                    required>

                <option value="">Select year</option>

                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>

            </select>


            <!-- Family Income -->
            <label for="family_income">
                Annual Family Income (₹)
            </label>

            <input
                type="number"
                id="family_income"
                name="family_income"
                min="0"
                placeholder="Example: 100000"
                required
            >


            <!-- Category -->
            <label for="category">
                Category
            </label>

            <select id="category"
                    name="category"
                    required>

                <option value="">Select category</option>

                <option value="General">General</option>
                <option value="OBC">OBC</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="EWS">EWS</option>
                <option value="Other">Other</option>

            </select>


            <!-- Percentage -->
            <label for="percentage">
                Previous Academic Percentage
            </label>

            <input
                type="number"
                id="percentage"
                name="percentage"
                min="0"
                max="100"
                step="0.01"
                placeholder="Example: 85.5"
                required
            >


            <!-- Gender -->
            <label for="gender">
                Gender
            </label>

            <select id="gender"
                    name="gender"
                    required>

                <option value="">Select gender</option>

                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">
                    Prefer not to say
                </option>

            </select>


            <button type="submit">
                Save & Continue
            </button>

        </form>

    </div>

</div>

{% include "chatbot_widget.html" %}
</body>

</html>
