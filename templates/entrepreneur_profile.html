<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrepreneur Profile - SchemeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="profile-page category-profile-page">
    <main class="auth-container">
        <section class="auth-box profile-box">
            <h1>🚀 Entrepreneur Profile</h1>
            <p>Tell us about your business to explore relevant support schemes.</p>

            {% if message %}<p class="profile-message" role="status">{{ message }}</p>{% endif %}

            <form class="profile-form" method="POST">
                <div class="profile-field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="18" max="120" required>
                </div>
                <div class="profile-field">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" autocomplete="address-level1" required>
                </div>
                <div class="profile-field">
                    <label for="district">District</label>
                    <input type="text" id="district" name="district" autocomplete="address-level2" required>
                </div>
                <div class="profile-field">
                    <label for="business_type">Business Type</label>
                    <select id="business_type" name="business_type" required>
                        <option value="">Select business type</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Services">Services</option>
                        <option value="Retail">Retail / Trading</option>
                        <option value="Agriculture">Agriculture / Allied</option>
                        <option value="Technology">Technology</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="business_stage">Business Stage</label>
                    <select id="business_stage" name="business_stage" required>
                        <option value="">Select business stage</option>
                        <option value="Planning">Planning</option>
                        <option value="Startup">Startup</option>
                        <option value="Operating">Operating business</option>
                        <option value="Expanding">Expanding business</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="registration_status">Business Registration</label>
                    <select id="registration_status" name="registration_status" required>
                        <option value="">Select registration status</option>
                        <option value="Registered">Registered</option>
                        <option value="Not registered">Not registered</option>
                        <option value="In progress">In progress</option>
                    </select>
                </div>
                <div class="profile-field">
                    <label for="annual_turnover">Annual Turnover (₹)</label>
                    <input type="number" id="annual_turnover" name="annual_turnover" min="0" step="1" required>
                </div>
                <div class="profile-field">
                    <label for="annual_income">Annual Family Income (₹)</label>
                    <input type="number" id="annual_income" name="annual_income" min="0" step="1" required>
                </div>
                <div class="profile-field">
                    <label for="category">Social Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="EWS">EWS</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit">Continue</button>
            </form>
        </section>
    </main>
{% include "chatbot_widget.html" %}
</body>
</html>
